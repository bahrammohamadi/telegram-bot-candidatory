name: Isolated integration live HTTP regression
on:
  push:
    branches: [feature/cloudflare-parity-audit-2026-10-29]
    paths:
      - '.github/workflows/candidatory-main-canary-http.yml'
      - 'cloudflare-live/review/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Probe actual isolated integration Worker, not obsolete preview routes
        env:
          URL: https://candidatory-miniapp-integration.lasvaram-candidatory.workers.dev
        run: |
          set -euo pipefail
          # This checks only the integration Worker. No production traffic or data is touched.
          code=$(curl --silent --show-error --max-time 20 -o home.html -w '%{http_code}' "$URL/")
          test "$code" = "200"
          grep -q 'lang="fa"' home.html
          grep -q 'dir="rtl"' home.html
          # Authentication must fail closed before D1 or user-scoped operations.
          for route in tasks assistant; do
            code=$(curl --silent --show-error --max-time 20 -o response.json -w '%{http_code}' -X POST "$URL/api/$route" -H "Content-Type: application/json" --data '{"action":"list","initData":"invalid"}')
            test "$code" = "401"
            node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("response.json","utf8"));if(j.error!=="TELEGRAM_AUTH_REQUIRED")process.exit(1)'
          done
          echo "PASS: isolated integration UI and fail-closed auth for tasks/assistant"
