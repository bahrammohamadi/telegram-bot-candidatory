name: Candidate ownership synthetic contract (offline)
on:
  push:
    branches:
      - feature/cloudflare-parity-audit-2026-10-29
    paths:
      - 'tests/offline/candidate-ownership-contract.test.mjs'
      - '.github/workflows/candidate-ownership-contract-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-ownership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline synthetic contract only (NOT production handlers)
        run: node --test tests/offline/candidate-ownership-contract.test.mjs
