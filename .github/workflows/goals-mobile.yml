name: Goals mobile checks
on:
  workflow_dispatch:
  push:
    branches: [feature/cloudflare-parity-audit-2026-10-29]
    paths: [cloudflare-live/phase4/**, .github/workflows/goals-mobile.yml]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cloudflare-live/phase4/build-goals.mjs
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node cloudflare-live/phase4/goals-visual-check.cjs
