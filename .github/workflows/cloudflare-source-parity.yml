name: Offline historical source regression (NOT live parity)
# Run source regressions for every commit to the authorized branch, not only PRs.
# This is offline CI; it does not deploy any Worker or create a runtime environment.
on:
  push:
    branches: [feature/cloudflare-parity-audit-2026-10-29]
  pull_request:
    paths:
      - 'cloudflare-live/**'
      - '.github/workflows/cloudflare-source-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Declare historical snapshot scope and enforce offline manifest parser regression
        run: |
          echo '::warning::This workflow validates repository snapshots only; it does NOT compare against active Cloudflare Production modules and cannot authorize deployment.'
          node scripts/verify-worker-artifact.mjs --self-test
      - name: Reconstruct repository snapshot from checked-in chunks
        run: node cloudflare-live/reconstruct.mjs
      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare-live/worker.js
      - name: Validate historical snapshot internal consistency
        run: node cloudflare-live/verify-snapshot.mjs
      - name: Validate historical environment snapshot fixtures (offline)
        run: node cloudflare-live/verify-environments.mjs
      - name: Validate authentication rejection before database access
        run: node cloudflare-live/auth-check.mjs
      - name: Validate synthetic profile round trips and access controls
        run: node cloudflare-live/integration-check.mjs
      - name: Build and validate offline navigation fixture (no deployment)
        run: |
          node cloudflare-live/build-staging.mjs
          node --check cloudflare-live/dist/staging-worker.mjs
          node --check cloudflare-live/phase2/navigation.js
      - name: Build integration candidate and verify atomic profile saves
        run: |
          node cloudflare-live/build-integration.mjs
          node --check cloudflare-live/dist/integration-worker.mjs
          node cloudflare-live/integration-check.mjs ./dist/integration-worker.mjs --phase3
  integration-navigation:
    # Playwright 1.51.1 does not support ubuntu-26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cloudflare-live/reconstruct.mjs && node cloudflare-live/build-integration.mjs
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node cloudflare-live/integration-navigation-check.cjs
