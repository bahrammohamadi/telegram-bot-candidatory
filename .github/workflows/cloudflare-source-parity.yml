name: Cloudflare live source parity
on:
  pull_request:
    paths:
      - 'cloudflare-live/**'
      - '.github/workflows/cloudflare-source-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact source from verified chunks
        run: node cloudflare-live/reconstruct.mjs
      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare-live/worker.js
      - name: Validate full source and feature parity
        run: node cloudflare-live/verify-snapshot.mjs
