name: Worker multipart artifact parity
# Always validate artifact safety on each change to the candidate branch,
# not only when the manifest scripts themselves change. No deployment.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate artifact manifest guard
        run: node scripts/verify-worker-artifact.mjs --self-test
      - name: Validate offline artifact manifest builder
        run: node scripts/build-worker-manifest.mjs --self-test
