# No staging/preview/test Worker or HTTP probes of a secondary environment are authorized.
# This workflow is intentionally manual-only and contains no deploy, network probe, or secret access.
name: Deprecated staging smoke (disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
