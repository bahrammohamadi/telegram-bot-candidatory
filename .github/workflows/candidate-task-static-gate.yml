name: Candidate task contract static gate
on:
  push:
    branches: [feature/cloudflare-parity-audit-2026-10-29]
    paths:
      - 'cloudflare-live/phase14/**'
      - '.github/workflows/candidate-task-static-gate.yml'
  pull_request:
    paths:
      - 'cloudflare-live/phase14/**'
      - '.github/workflows/candidate-task-static-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic ownership regression coverage
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-live/phase14/tasks-e2e.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const src=readFileSync('cloudflare-live/phase14/tasks-e2e.mjs','utf8');
          for (const marker of [
            "call('invalid','list')",
            "call(other,'list')",
            "call(other,'update'",
            "call(other,'status'",
            "call(other,'delete'",
            "call(user,'status',{id:isolatedTask.data.id",
            "call(user,'delete',{id:isolatedTask.data.id",
            "call(other,'unknown-action'",
            "candidate_tasks_v1",
            "assert.equal(r.status,401,'forged Telegram identity rejected')",
            "assert.equal(denied.status,429)",
            "assert.equal((await call(other,'summary')).data.summary.total,0",
            "assert.equal((await call(other,'update',{...sample,id:taskId,title:'Unauthorized edit'})).status,404)",
            "assert.equal((await call(user,'list')).data.tasks[0].done_at,null)"
          ]) assert.ok(src.includes(marker), 'Missing offline regression: '+marker);
          assert.ok(src.includes("new DatabaseSync(':memory:')"),'Tests must use synthetic in-memory SQLite');
          assert.ok(!/https?:\/\/(?!tasks\.synthetic)/.test(src),'Unexpected external URL in synthetic test');
          assert.ok(src.includes("readFileSync(new URL('./tasks-migration.sql'"),'Synthetic tests must load task schema');
          assert.ok(src.includes("readFileSync(new URL('../integration-schema.sql'"),'Synthetic tests must load integration schema');
          assert.ok(!/cloudflare\.com|workers\.dev|api\.telegram\.org/.test(src),'Synthetic test must not target live services');
          console.log('PASS static task security/ownership/expiry contract markers (not a runtime E2E pass)');
          JS

      - name: Validate task D1 schema contract without database access
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const sql=readFileSync('cloudflare-live/phase14/tasks-migration.sql','utf8');
          const normalized=sql.replace(/--[^\n]*/g,' ').replace(/\s+/g,' ').toLowerCase();
          assert.match(normalized,/create table if not exists candidate_tasks_v1\s*\(/);
          assert.match(normalized,/telegram_id integer not null references candidate_users\(telegram_id\) on delete cascade/);
          assert.match(normalized,/create index if not exists idx_candidate_tasks_owner_due on candidate_tasks_v1\(telegram_id,status,due_date\)/);
          assert.match(normalized,/create trigger if not exists trg_candidate_tasks_quota_v1 before insert/);
          assert.match(normalized,/where telegram_id=new\.telegram_id/);
          assert.match(normalized,/raise\(abort,'task_quota_limit'\)/);
          assert.doesNotMatch(normalized,/\b(drop table|drop index|alter table|delete from|truncate)\b/);
          console.log('PASS task D1 schema contract (source-only; no D1 calls)');
          JS

      - name: Execute synthetic SQLite schema checks (no external services)
        shell: bash
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {DatabaseSync} from 'node:sqlite';
          const db=new DatabaseSync(':memory:');
          try {
            db.exec(readFileSync('cloudflare-live/integration-schema.sql','utf8'));
            db.exec(readFileSync('cloudflare-live/phase14/tasks-migration.sql','utf8'));
            const cols=db.prepare("PRAGMA table_info('candidate_tasks_v1')").all().map(x=>x.name);
            for(const c of ['id','telegram_id','title','status','due_date']) assert.ok(cols.includes(c),'Missing column '+c);
            const idx=db.prepare("PRAGMA index_info('idx_candidate_tasks_owner_due')").all().map(x=>x.name);
            assert.deepEqual(idx,['telegram_id','status','due_date']);
            const fk=db.prepare("PRAGMA foreign_key_list('candidate_tasks_v1')").all();
            assert.ok(fk.some(x=>x.table==='candidate_users'&&x.from==='telegram_id'&&x.to==='telegram_id'));
            const triggers=db.prepare("SELECT name FROM sqlite_master WHERE type='trigger'").all().map(x=>x.name);
            assert.ok(triggers.includes('trg_candidate_tasks_quota_v1'));
            console.log('PASS SQLite schema, index, foreign key and quota trigger on synthetic in-memory database');
          } finally {db.close();}
          JS

      - name: Guard isolated-only migration provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const migration=readFileSync('cloudflare-live/phase14/tasks-migration.sql','utf8');
          const header=migration.split(/\r?\n/).slice(0,5).join('\n');
          assert.match(header,/Apply ONLY to isolated D1/,'Migration provenance changed; production D1 application requires separate authorization');
          assert.doesNotMatch(migration,/\b(?:DROP\s+TABLE|DELETE\s+FROM|ALTER\s+TABLE|TRUNCATE)\b/i);
          console.log('PASS: migration remains isolated-only; no production D1 migration authorized');
          JS
