name: Candidate task contract static gate
on:
  push:
    branches: [feature/cloudflare-parity-audit-2026-10-29]
    paths:
      - 'cloudflare-live/phase14/**'
      - '.github/workflows/candidate-task-static-gate.yml'
  pull_request:
    paths:
      - 'cloudflare-live/phase14/**'
      - '.github/workflows/candidate-task-static-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic ownership regression coverage
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-live/phase14/tasks-e2e.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const src=readFileSync('cloudflare-live/phase14/tasks-e2e.mjs','utf8');
          for (const marker of [
            "call('invalid','list')",
            "call(other,'list')",
            "call(other,'update'",
            "call(other,'status'",
            "call(other,'delete'",
            "call(user,'status',{id:isolatedTask.data.id",
            "call(user,'delete',{id:isolatedTask.data.id",
            "call(other,'unknown-action'",
            "candidate_tasks_v1",
            "assert.equal(r.status,401,'forged Telegram identity rejected')",
            "assert.equal(denied.status,429)",
            "assert.equal((await call(other,'summary')).data.summary.total,0",
            "assert.equal((await call(user,'update',{...sample,id:taskId,title:'Unauthorized edit'})).status,404)",
            "assert.equal((await call(user,'list')).data.tasks[0].done_at,null)"
          ]) assert.ok(src.includes(marker), 'Missing offline regression: '+marker);
          assert.ok(src.includes("new DatabaseSync(':memory:')"),'Tests must use synthetic in-memory SQLite');
          assert.ok(!/https?:\/\/(?!tasks\.synthetic)/.test(src),'Unexpected external URL in synthetic test');
          assert.ok(src.includes("readFileSync(new URL('./tasks-migration.sql'"),'Synthetic tests must load task schema');
          assert.ok(src.includes("readFileSync(new URL('../integration-schema.sql'"),'Synthetic tests must load integration schema');
          assert.ok(!/cloudflare\.com|workers\.dev|api\.telegram\.org/.test(src),'Synthetic test must not target live services');
          console.log('PASS static task security/ownership/expiry contract markers (not a runtime E2E pass)');
          JS
