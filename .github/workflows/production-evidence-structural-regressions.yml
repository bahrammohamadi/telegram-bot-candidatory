name: Production evidence structural gate regressions (offline)
on:
  push:
    branches:
      - feature/cloudflare-parity-audit-2026-10-29
    paths:
      - 'tools/check-production-evidence.mjs'
      - 'tests/offline/production-evidence-gate-regression.test.mjs'
      - '.github/workflows/production-evidence-structural-regressions.yml'
  pull_request:
    paths:
      - 'tools/check-production-evidence.mjs'
      - 'tests/offline/production-evidence-gate-regression.test.mjs'
      - '.github/workflows/production-evidence-structural-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-structural-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check tools/check-production-evidence.mjs
          node --check tests/offline/production-evidence-gate-regression.test.mjs
      - name: Run synthetic offline structural regressions
        run: node --test tests/offline/production-evidence-gate-regression.test.mjs
