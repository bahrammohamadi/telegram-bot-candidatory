<section id="quiz-panel" class="panel" hidden>
<h3>آزمون‌های آموزشی و سنجش دانش</h3>
<p>سؤال‌های بی‌طرفانه درباره سواد رسانه‌ای و پاسخ‌گویی عمومی. نتیجه توسط سرور محاسبه می‌شود؛ پاسخ درست پس از ثبت کامل آزمون نمایش داده می‌شود.</p>
<div id="quiz-status" role="status" aria-live="polite"></div>
<div id="quiz-catalog" class="panel"></div>
<form id="quiz-form" hidden>
<h4 id="quiz-form-title"></h4>
<div id="quiz-questions" class="panel"></div>
<button type="submit" id="quiz-submit">ثبت پاسخ‌ها و مشاهده نتیجه</button>
<button type="button" id="quiz-cancel" class="secondary">انصراف از این آزمون</button>
</form>
<section id="quiz-result" class="panel" hidden><h4>نتیجه آزمون</h4><div id="quiz-score"></div><div id="quiz-feedback"></div><button id="quiz-result-close" type="button" class="secondary">بازگشت به فهرست آزمون‌ها</button></section>
<section class="panel"><h4>سوابق آزمون‌های من</h4><div id="quiz-history"></div></section>
<button id="quiz-close" type="button" class="secondary">بازگشت به تمرین و آمادگی</button>
</section>
